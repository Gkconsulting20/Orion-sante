kind = "web"
previewPath = "/"
title = "Orion Santé"
description = "Gestion des patients, consultations, factures, reçus et trésorerie pour les cliniques au Togo, dans l’univers ComptaOrion."
version = "1.0.0"
id = "artifacts/orion-sante"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20036

[services.development]
run = "pnpm --filter @workspace/orion-sante run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/orion-sante", "run", "build" ]
serve = "static"
publicDir = "artifacts/orion-sante/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20036"
BASE_PATH = "/"
