openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Orion Santé
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /workspace:
    get:
      operationId: getWorkspace
      responses:
        "200":
          description: Current clinic records, isolated per account or demo browser
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        "200":
          description: Aggregated clinic activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /patients:
    post:
      operationId: createPatient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatientInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Patient" }
  /patients/{id}:
    put:
      operationId: updatePatient
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatientInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Patient" }
    delete:
      operationId: deletePatient
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
  /visits:
    post:
      operationId: createVisit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Visit" }
  /visits/{id}:
    put:
      operationId: updateVisit
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Visit" }
  /invoices:
    post:
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
  /payments:
    post:
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentInput" }
      responses:
        "201":
          description: Payment and unique receipt created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
  /expenses:
    post:
      operationId: createExpense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
  /settings:
    put:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
  /cash-session:
    post:
      operationId: setCashSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CashSessionInput" }
      responses:
        "200":
          description: Cash session updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashSession" }
  /audit-log:
    get:
      operationId: getAuditLog
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
      responses:
        "200":
          description: Journal d'audit de la clinique
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditLogEntry" }
  /members:
    post:
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
  /members/{userId}:
    put:
      operationId: updateMember
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberRoleInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
    delete:
      operationId: deleteMember
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
  /patients/{id}/export:
    get:
      operationId: exportPatient
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Patient export
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientExport" }
  /platform/me:
    get:
      operationId: getPlatformMe
      responses:
        "200":
          description: Platform admin status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformMe" }
  /platform/trial/status:
    get:
      operationId: getPlatformTrialStatus
      responses:
        "200":
          description: Trial status of the signed-in clinic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrialStatus" }
  /platform/trial/start:
    post:
      operationId: startPlatformTrial
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrialStartInput" }
      responses:
        "201":
          description: Trial started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrialStatus" }
  /platform/dashboard:
    get:
      operationId: getPlatformDashboard
      responses:
        "200":
          description: Platform dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformDashboard" }
  /platform/clients:
    get:
      operationId: getPlatformClients
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatformClient" }
    post:
      operationId: createPlatformClient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformClientInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformClient" }
  /platform/clients/{id}:
    put:
      operationId: updatePlatformClient
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformClientUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformClient" }
    delete:
      operationId: deletePlatformClient
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
  /platform/salespeople:
    get:
      operationId: getPlatformSalespeople
      responses:
        "200":
          description: Salespeople
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatformSalesperson" }
    post:
      operationId: createPlatformSalesperson
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformSalespersonInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSalesperson" }
  /platform/salespeople/{id}:
    put:
      operationId: updatePlatformSalesperson
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformSalespersonInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSalesperson" }
    delete:
      operationId: deletePlatformSalesperson
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
  /platform/plans:
    get:
      operationId: getPlatformPlans
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatformPlan" }
    post:
      operationId: createPlatformPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformPlanInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformPlan" }
  /platform/plans/{id}:
    put:
      operationId: updatePlatformPlan
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformPlanInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformPlan" }
    delete:
      operationId: deletePlatformPlan
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
  /platform/subscriptions:
    get:
      operationId: getPlatformSubscriptions
      responses:
        "200":
          description: Subscriptions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatformSubscription" }
    post:
      operationId: createPlatformSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformSubscriptionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSubscription" }
  /platform/subscriptions/{id}/cancel:
    post:
      operationId: cancelPlatformSubscription
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSubscription" }
  /platform/sales:
    get:
      operationId: getPlatformSales
      parameters:
        - { name: source, in: query, schema: { type: string } }
      responses:
        "200":
          description: Sales
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatformSale" }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    PatientInput:
      type: object
      required: [firstName, lastName, sex, birthDate, phone, address, emergencyContact, allergies]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        sex: { type: string, enum: [F, M] }
        birthDate: { type: string }
        phone: { type: string, maxLength: 30 }
        address: { type: string, maxLength: 300 }
        emergencyContact: { type: string, maxLength: 300 }
        allergies: { type: string, maxLength: 2000 }
        consentGiven: { type: boolean }
        consentDate: { type: string }
        consentMethod: { type: string, enum: [oral, "écrit"] }
    Patient:
      allOf:
        - { $ref: "#/components/schemas/PatientInput" }
        - type: object
          required: [id, number, createdAt]
          properties:
            id: { type: string }
            number: { type: string }
            createdAt: { type: string }
    VisitInput:
      type: object
      required: [patientId, service, practitioner, scheduledAt, status, reason, notes, prescription, temperature, bloodPressure, weight]
      properties:
        patientId: { type: string, minLength: 1 }
        service: { type: string, minLength: 1, maxLength: 100 }
        practitioner: { type: string, minLength: 1, maxLength: 100 }
        scheduledAt: { type: string }
        status: { type: string, enum: [scheduled, waiting, in_progress, completed, cancelled] }
        reason: { type: string, maxLength: 1000 }
        notes: { type: string, maxLength: 10000 }
        prescription: { type: string, maxLength: 5000 }
        temperature: { type: string, maxLength: 20 }
        bloodPressure: { type: string, maxLength: 30 }
        weight: { type: string, maxLength: 20 }
    Visit:
      allOf:
        - { $ref: "#/components/schemas/VisitInput" }
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string }
            createdAt: { type: string }
    InvoiceLine:
      type: object
      required: [label, quantity, unitPrice]
      properties:
        label: { type: string, minLength: 1, maxLength: 200 }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
        unitPrice: { type: integer, minimum: 0, maximum: 100000000 }
    InvoiceInput:
      type: object
      required: [patientId, service, lines]
      properties:
        patientId: { type: string, minLength: 1 }
        visitId: { type: string }
        service: { type: string, minLength: 1 }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/InvoiceLine" }
    Invoice:
      allOf:
        - { $ref: "#/components/schemas/InvoiceInput" }
        - type: object
          required: [id, number, total, paid, status, createdAt]
          properties:
            id: { type: string }
            number: { type: string }
            total: { type: integer }
            paid: { type: integer }
            status: { type: string, enum: [unpaid, partial, paid] }
            createdAt: { type: string }
            anonymized: { type: boolean }
    PaymentInput:
      type: object
      required: [invoiceId, amount, method, reference, requestId]
      properties:
        invoiceId: { type: string }
        amount: { type: integer, minimum: 1, maximum: 100000000 }
        method: { type: string, enum: [cash, tmoney, flooz, bank] }
        reference: { type: string, maxLength: 100 }
        requestId: { type: string, minLength: 1, maxLength: 100 }
    Payment:
      allOf:
        - { $ref: "#/components/schemas/PaymentInput" }
        - type: object
          required: [id, receiptNumber, patientId, createdAt]
          properties:
            id: { type: string }
            receiptNumber: { type: string }
            patientId: { type: string }
            createdAt: { type: string }
            anonymized: { type: boolean }
    ExpenseInput:
      type: object
      required: [label, supplier, category, amount, method]
      properties:
        label: { type: string, minLength: 1, maxLength: 300 }
        supplier: { type: string, maxLength: 200 }
        category: { type: string, enum: [supplies, salary, utilities, equipment, other] }
        amount: { type: integer, minimum: 1, maximum: 100000000 }
        method: { type: string, enum: [cash, tmoney, flooz, bank] }
    Expense:
      allOf:
        - { $ref: "#/components/schemas/ExpenseInput" }
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string }
            createdAt: { type: string }
    Service:
      type: object
      required: [id, name, price]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1 }
        price: { type: integer, minimum: 0 }
    Settings:
      type: object
      required: [clinicName, address, phone, email, receiptFooter, services, practitioners]
      properties:
        clinicName: { type: string, minLength: 1, maxLength: 150 }
        address: { type: string, maxLength: 300 }
        phone: { type: string, maxLength: 30 }
        email: { type: string, maxLength: 150 }
        receiptFooter: { type: string, maxLength: 500 }
        services:
          type: array
          items: { $ref: "#/components/schemas/Service" }
        practitioners:
          type: array
          items: { type: string }
    CashSessionInput:
      type: object
      required: [action, openingBalance]
      properties:
        action: { type: string, enum: [open, close] }
        openingBalance: { type: integer, minimum: 0, maximum: 100000000 }
    CashSession:
      type: object
      required: [isOpen, openingBalance, openedAt, closedAt, closingBalance]
      properties:
        isOpen: { type: boolean }
        openingBalance: { type: integer }
        openedAt: { type: string }
        closedAt: { type: string }
        closingBalance: { type: integer }
    Activity:
      type: object
      required: [id, label, createdAt, kind]
      properties:
        id: { type: string }
        label: { type: string }
        createdAt: { type: string }
        kind: { type: string }
    Workspace:
      type: object
      required: [isDemo, role, patients, visits, invoices, payments, expenses, settings, cashSession, activity, members, auditLog]
      properties:
        isDemo: { type: boolean }
        role: { type: string }
        patients:
          type: array
          items: { $ref: "#/components/schemas/Patient" }
        visits:
          type: array
          items: { $ref: "#/components/schemas/Visit" }
        invoices:
          type: array
          items: { $ref: "#/components/schemas/Invoice" }
        payments:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        expenses:
          type: array
          items: { $ref: "#/components/schemas/Expense" }
        settings: { $ref: "#/components/schemas/Settings" }
        cashSession: { $ref: "#/components/schemas/CashSession" }
        activity:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
        members:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        auditLog:
          type: array
          items: { $ref: "#/components/schemas/AuditLogEntry" }
        plan: { $ref: "#/components/schemas/PlatformPlan" }
    RevenuePoint:
      type: object
      required: [date, receipts, expenses]
      properties:
        date: { type: string }
        receipts: { type: integer }
        expenses: { type: integer }
    ServiceTotal:
      type: object
      required: [name, amount, count]
      properties:
        name: { type: string }
        amount: { type: integer }
        count: { type: integer }
    Dashboard:
      type: object
      required: [patientsTotal, patientsToday, visitsToday, waitingToday, receiptsToday, receiptsMonth, unpaidTotal, expensesMonth, revenue, services]
      properties:
        patientsTotal: { type: integer }
        patientsToday: { type: integer }
        visitsToday: { type: integer }
        waitingToday: { type: integer }
        receiptsToday: { type: integer }
        receiptsMonth: { type: integer }
        unpaidTotal: { type: integer }
        expensesMonth: { type: integer }
        revenue:
          type: array
          items: { $ref: "#/components/schemas/RevenuePoint" }
        services:
          type: array
          items: { $ref: "#/components/schemas/ServiceTotal" }
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    ClinicRole:
      type: string
      enum: [owner, doctor, secretary, accountant]
    Member:
      type: object
      required: [userId, name, email, role]
      properties:
        userId: { type: string }
        name: { type: string, maxLength: 150 }
        email: { type: string, maxLength: 150 }
        role: { $ref: "#/components/schemas/ClinicRole" }
    MemberInput:
      type: object
      required: [userId, name, email, role]
      properties:
        userId: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, maxLength: 150 }
        email: { type: string, maxLength: 150 }
        role: { $ref: "#/components/schemas/ClinicRole" }
    MemberRoleInput:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/ClinicRole" }
    AuditLogEntry:
      type: object
      required: [id, createdAt, actorId, actorLabel, action, entity, recordId, detail]
      properties:
        id: { type: string }
        createdAt: { type: string }
        actorId: { type: string }
        actorLabel: { type: string }
        action: { type: string }
        entity: { type: string }
        recordId: { type: string }
        detail: { type: string }
    PatientExport:
      type: object
      required: [patient, visits, invoices, payments]
      properties:
        patient: { $ref: "#/components/schemas/Patient" }
        visits:
          type: array
          items: { $ref: "#/components/schemas/Visit" }
        invoices:
          type: array
          items: { $ref: "#/components/schemas/Invoice" }
        payments:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
    PlatformMe:
      type: object
      required: [isPlatformAdmin]
      properties:
        isPlatformAdmin: { type: boolean }
    TrialStartInput:
      type: object
      required: [clinicName, contactName, phone]
      properties:
        clinicName: { type: string, minLength: 1, maxLength: 150 }
        contactName: { type: string, minLength: 1, maxLength: 150 }
        phone: { type: string, minLength: 1, maxLength: 30 }
        email: { type: string, maxLength: 150 }
        ref: { type: string, maxLength: 100 }
    TrialStatus:
      type: object
      required: [status, daysLeft, endDate, planName]
      properties:
        status: { type: string, enum: [none, active, expired, converted] }
        daysLeft: { type: integer, minimum: 0 }
        endDate: { type: string }
        planName: { type: string }
    PlatformPlan:
      type: object
      required: [id, name, priceMonthly, periodMonths, maxUsers, maxPatients, maxStorageGb, features, active]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 100 }
        priceMonthly: { type: integer, minimum: 0 }
        periodMonths: { type: integer, minimum: 1 }
        maxUsers: { type: integer, minimum: 1 }
        maxPatients: { type: integer, minimum: 1 }
        maxStorageGb: { type: integer, minimum: 0 }
        features: { type: string, maxLength: 2000 }
        active: { type: boolean }
    PlatformPlanInput:
      type: object
      required: [name, priceMonthly, periodMonths, maxUsers, maxPatients, maxStorageGb, features, active]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        priceMonthly: { type: integer, minimum: 0 }
        periodMonths: { type: integer, minimum: 1 }
        maxUsers: { type: integer, minimum: 1 }
        maxPatients: { type: integer, minimum: 1 }
        maxStorageGb: { type: integer, minimum: 0 }
        features: { type: string, maxLength: 2000 }
        active: { type: boolean }
    PlatformClient:
      type: object
      required: [id, clinicName, contactName, email, phone, status, source, commercialId, ownerId, planId, planAmount, createdAt, lastLoginAt]
      properties:
        id: { type: string }
        clinicName: { type: string, maxLength: 150 }
        contactName: { type: string, maxLength: 150 }
        email: { type: string, maxLength: 150 }
        phone: { type: string, maxLength: 30 }
        status: { type: string, enum: [trial, active, suspended, inactive] }
        source: { type: string, enum: [web, commercial, partner] }
